# =====================================================================
# Proyecto SED - MercaUca: Docker Compose para MySQL 8.0
# =====================================================================
services:
  mysql-db:
    image: mysql:8.0
    container_name: proyectoseguridad-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mercauca
      MYSQL_USER: mercauca_user
      MYSQL_PASSWORD: mercauca_pass
    ports:
      # Puerto 3308 expuesto al host para evitar conflictos si MySQL nativo corre en 3306
      - "${DB_PORT:-3308}:3306"
    volumes:
      # Volumen para que los datos persistan de por vida en Docker
      - proyectoseguridad_mysql_data:/var/lib/mysql
      # Script de inicialización que crea tablas y datos iniciales en el primer inicio
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  proyectoseguridad_mysql_data:
    name: proyectoseguridad_mysql_data

