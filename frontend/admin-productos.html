<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MercaUca — Administración de Productos</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="admin-wrap">
    <header class="admin-header">
      <h1>Administración de Productos</h1>
      <a href="index.html" class="admin-link-back">Volver al sitio</a>
    </header>

    <div id="no-login-view" style="display:none;" class="admin-aviso">
      Debes iniciar sesión para ver esta sección. <a href="login.html">Iniciar sesión</a>
    </div>

    <div id="no-admin-view" style="display:none;" class="admin-aviso">
      Acceso denegado: esta sección es solo para administradores.
    </div>

    <div id="admin-productos-panel" style="display:none;">
      <section class="admin-table-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h2>Productos</h2>
          <label><input type="checkbox" id="ap-filtro-sin-stock" /> Mostrar solo sin existencias</label>
        </div>
        <table class="admin-table">
          <thead>
            <tr><th>ID</th><th>Producto</th><th>Vendedor</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
          </thead>
          <tbody id="ap-tbody"></tbody>
        </table>
      </section>
    </div>

    <div id="modal-editar-producto" class="admin-modal" style="display:none;">
      <div class="admin-modal-content">
        <h2>Editar producto</h2>
        <form id="form-editar-producto" class="admin-form" enctype="multipart/form-data">
          <input type="hidden" id="ep-id" />
          <input type="text" id="ep-titulo" placeholder="Título" />
          <input type="text" id="ep-marca" placeholder="Marca" />
          <select id="ep-categoria"></select>
          <select id="ep-condicion"></select>
          <input type="number" step="0.01" id="ep-precio" placeholder="Precio" />
          <input type="number" id="ep-stock" placeholder="Stock" />
          <textarea id="ep-descripcion" placeholder="Descripción"></textarea>
          <input type="file" id="ep-imagen" accept="image/jpeg,image/png,image/webp" />
          <div class="admin-modal-actions">
            <button type="button" id="ep-cancelar">Cancelar</button>
            <button type="submit">Guardar cambios</button>
          </div>
        </form>
        <p id="ep-error" class="admin-error" style="display:none;"></p>
      </div>
    </div>
  </div>

  <script>window.API_URL = '';</script>
  <script src="js/api.js"></script>
  <script src="js/admin-productos.js"></script>
</body>
</html>
